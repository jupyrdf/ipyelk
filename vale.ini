MinAlertLevel = warning
StylesPath = scripts/vale
Vocab = IPyElk

[*.{md,py}]
BasedOnStyles = Vale, IPyElk, proselint, write-good
# replaced by IPyElk.Spelling (en_US, skips RST markup in docstrings)
Vale.Spelling = NO
# "(c)" in license headers and ASCII "..." are project conventions
proselint.Typography = NO
# reference docs describe what happens to objects ("is removed", "is called")
write-good.Passive = NO
# flags core technical words ("multiple", "minimum", "implement")
write-good.TooWordy = NO
# flags meaning-bearing qualifiers ("usually", "several"); proselint.Very covers filler
write-good.Weasel = NO
# flags "-- so", a common clause join here
write-good.So = NO
# flags every "is"/"was"
write-good.E-Prime = NO

[*.py]
# TODO comments are tracked work
proselint.Annotations = NO
# also matches inside RST literals (``ui``), which code comments can't skip
Vale.Terms = NO
