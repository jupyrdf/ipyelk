name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  CACHE_EPOCH: 10
  ATEST_RETRIES: 2
  ALL_PY_COV_FAIL_UNDER: 73

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.67.0
          cache: true
          environments: build
          cache-key: job-build
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ env.CACHE_EPOCH }}-${{ hashFiles('yarn.lock') }}-node-modules
      # the labextension build resolves `@jupyterlab/core-meta` over the network
      # (the legacy `@jupyterlab/builder` cannot read a locally installed copy):
      # cache it, or a slow npm registry kills the build (seen: read timeout in
      # `build-js-ext`, which took the whole atest run with it)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jupyterlab_builder
          key: ${{ env.CACHE_EPOCH }}-${{ hashFiles('package.json') }}-jlpm-core-meta
      - run: pixi run setup-js
      - run: touch node_modules/.cached-in-ci
      - run: pixi run dist
      - uses: actions/upload-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-dist
          path: |
            dist
            .pixi/task-cache-v0
      - uses: actions/upload-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-build
          path: |
            build/tsc/.*.tsbuildinfo
            lib
            src/_d
            .pixi/task-cache-v0

  build-cov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.67.0
          cache: true
          environments: build
          cache-key: job-build
      - uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ env.CACHE_EPOCH }}-${{ hashFiles('yarn.lock') }}-node-modules
      # the labextension build resolves `@jupyterlab/core-meta` over the network
      # (the legacy `@jupyterlab/builder` cannot read a locally installed copy):
      # cache it, or a slow npm registry kills the build (seen: read timeout in
      # `build-js-ext`, which took the whole atest run with it)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jupyterlab_builder
          key: ${{ env.CACHE_EPOCH }}-${{ hashFiles('package.json') }}-jlpm-core-meta
      - run: pixi run setup-js
      - run: touch node_modules/.cached-in-ci
      - run: pixi run build-js-ext-cov
      - uses: actions/upload-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-build-cov
          path: |
            build/tsc/.*.tsbuildinfo.cov
            build/labextensions-cov
            .pixi/task-cache-v0

  lint:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.67.0
          cache: true
          environments: build lint
          cache-key: job-lint
      - name: cache (node)
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ env.CACHE_EPOCH }}-${{ hashFiles('yarn.lock') }}-node-modules
      - uses: actions/download-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-dist
      - uses: actions/download-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-build
      - run: pixi run fix && pixi run fix
      - run: pixi run lint

  docs:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.67.0
          cache: true
          environments: build check docs lite
          cache-key: job-lint
      - name: cache (node)
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ env.CACHE_EPOCH }}-${{ hashFiles('yarn.lock') }}-node-modules
      - uses: actions/download-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-dist
      - uses: actions/download-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-build
      - run: pixi run docs-lite
      - run: pixi run docs
      - run: pixi run check
      - uses: actions/upload-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-docs
          path: |
            build/docs
            build/reports

  test:
    name: ${{ matrix.task }} (${{ matrix.vm }})
    runs-on: ${{ matrix.vm }}
    needs: [build, build-cov]
    strategy:
      fail-fast: false
      matrix:
        vm: [ubuntu-latest, windows-latest, macos-14, macos-latest]
        task: [test, test-oldest]
        exclude:
          - { vm: macos-14, task: test }
          - { vm: macos-latest, task: test-oldest }
        include:
          - { vm: macos-14, atest-args: '' }
          - { vm: macos-latest, atest-args: '' }
          - { vm: ubuntu-latest, atest-args: '' }
          - { vm: windows-latest, atest-args: '--exclude ci:skip-win' }
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.67.0
          cache: true
          environments: a${{ matrix.task }} i${{ matrix.task }} u${{ matrix.task }}
          cache-key: job-${{ matrix.task }}
      - uses: actions/download-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-dist
      - uses: actions/download-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-build
      - if: matrix.task == 'test'
        uses: actions/download-artifact@v4
        with:
          name: ipyelk-${{ github.run_number }}-build-cov
      # the labextension build resolves `@jupyterlab/core-meta` over the network
      # (the legacy `@jupyterlab/builder` cannot read a locally installed copy):
      # cache it, or a slow npm registry kills the build (seen: read timeout in
      # `build-js-ext`, which took the whole atest run with it)
      - uses: actions/cache@v4
        with:
          path: ~/.cache/jupyterlab_builder
          key: ${{ env.CACHE_EPOCH }}-${{ hashFiles('package.json') }}-jlpm-core-meta
      - run: pixi run u${{ matrix.task }}-pytest
      - if: matrix.task == 'test'
        run: pixi run test-js
      - run: pixi run i${{ matrix.task }}-nbconvert
      - if: matrix.task == 'test' && matrix.vm == 'ubuntu-latest'
        uses: actions/cache@v4
        with:
          path: |
            node_modules
          key: ${{ env.CACHE_EPOCH }}-${{ hashFiles('yarn.lock') }}-node-modules
      - env:
          # 04_Interactive's slider bursts (tag `gh:95`) report a skip and a
          # warning instead of failing where they still hang now and then:
          # - macOS: the page keeps the previous graph (#95); drop this once the
          #   fix for sprotty 1.4's FadeAnimation wedging the command stack lands
          # - test-oldest (ubuntu-latest): the kernel stops running cells (#177);
          #   drop this once that stall is understood
          ATEST_ARGS: >-
            ${{ matrix.atest-args }}
            ${{ (startsWith(matrix.vm, 'macos') || (matrix.task == 'test-oldest' && matrix.vm == 'ubuntu-latest')) && '--skiponfailure gh:95' || '' }}
        # a browser that dies mid-test (Firefox 128 ESR went out of memory after
        # a kernel restart in 02_Transformer) leaves geckodriver unreachable, and
        # the teardown then spends ~10 minutes per Selenium call on urllib3
        # retries; Robot's `Test Timeout` does not cover teardown, so the job ran
        # to GitHub's 6-hour limit (twice on master). A passing atest step takes
        # under 15 minutes including retries; fail with artifacts instead.
        timeout-minutes: 45
        run: pixi run a${{ matrix.task }}-robot
      - if: ${{ !cancelled() && matrix.task == 'test' && matrix.vm == 'ubuntu-latest' }}
        run: pixi run bench-check
      - if: matrix.task == 'test' && matrix.vm == 'ubuntu-latest'
        run: pixi run report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipyelk-${{ github.run_number }}-${{ matrix.task }}-${{ matrix.vm }}
          path: |
            build/reports
