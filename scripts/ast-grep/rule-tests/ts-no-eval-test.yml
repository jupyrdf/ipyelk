id: ts-no-eval
valid:
  - setTimeout(x || (() => console.warn('fallback')), 100);
  - |
    setTimeout(ready ? run : () => log('later'), 100);
  - setTimeout(show, 100, 'label');
  - setTimeout(finish, 100);
  - window.setTimeout(() => this.update(), 1000);
  - setTimeout(() => log('a' + b), 10);
  - const f = new Map();
  - model.evaluate(x);
  - model.eval(x);
  - const f = new MyFunction();
  - isFunction(x);
invalid:
  - setTimeout('a' + b + 'c' + d, 100);
  - eval(code);
  - window.eval(code);
  - globalThis.eval(code);
  - (0, eval)(code);
  - const f = new Function('a', 'return a');
  - const f = Function('return 1');
  - const f = new window.Function('return 1');
  - setTimeout('update()', 100);
  - setInterval('tick()', 10);
  - window.setInterval(`tick(${n})`, 10);
  - self.setTimeout('update()', 100);
  - globalThis.setTimeout('update()', 100);
  - setTimeout('update(' + n + ')', 100);
